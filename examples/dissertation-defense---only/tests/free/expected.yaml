tosca_definitions_version: tosca_simple_yaml_1_3

imports:
    - lib/types.yaml

topology_template:
    inputs:
        os_credentials:
            type: string
            default: secret

    outputs:
        input:
            type: string
            value: {get_property: [virtual_machine, public_address]}

    node_templates:
        shop:
            type: application
            requirements:
                - host: virtual_machine
            #artifacts:
            #    archive:
            #        type: zip.archive
            #        file: files/shop.core.zip

        virtual_machine:
            type: application
            properties:
                public_address: some_value
            requirements:
                - host: openstack

        openstack:
            type: application
            properties:
                os_credentials: {get_input: os_credentials}
